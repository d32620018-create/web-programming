<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Использование рисунка в качестве карты</title>
</head>
<body>

    <p align="center">Кликните на левую, среднюю или правую часть изображения для перехода:</p>

    <div align="center">
        <!-- Вставляем рисунок, задаем фиксированный размер и связываем с картой -->
        <img src="map.jpg" width="600" height="200" usemap="#navigation_map" border="0" alt="Навигационная карта">

        <!-- Описание карты-изображения -->
        <map name="navigation_map">
            
            <!-- Левая треть картинки (от 0 до 200 пикселей по ширине) -->
            <area shape="rect" coords="0,0,200,200" href="page1.htm" alt="На страницу 1">

            <!-- Средняя треть картинки (от 200 до 400 пикселей по ширине) -->
            <area shape="rect" coords="200,0,400,200" href="page2.htm" alt="На страницу 2">

            <!-- Правая треть картинки (от 400 до 600 пикселей по ширине) -->
            <area shape="rect" coords="400,0,600,200" href="page3.htm" alt="На страницу 3">

            <!-- Зона по умолчанию для исключения ошибок -->
            <area shape="default" nohref>
            
        </map>
    </div>

</body>
</html>
