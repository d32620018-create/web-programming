<html>
<head>
    <title>Задание 4. Заполнение таблицы</title>
</head>

<body>

<table border="3" width="100%">

    <!-- Первая строка -->
    <tr>

        <!-- Картинка -->
        <td bgcolor="green">
            <img src="sun.jpg" width="200" height="150">
        </td>

        <td bgcolor="red">
            <font color="white">
                Круглым
            </font>
        </td>

        <td bgcolor="blue">
            <font color="white">
                Желтым
            </font>
        </td>

    </tr>

    <!-- Вторая строка -->
    <tr>

        <td bgcolor="green">
            <font color="white">
                Белым
            </font>
        </td>

        <!-- Четверостишие -->
        <td bgcolor="red">
            <font color="white">
                Люблю грозу в начале мая,<br>
                Когда весенний первый гром,<br>
                Как бы резвяся и играя,<br>
                Грохочет в небе голубом.
            </font>
        </td>

        <!-- Красная ячейка -->
        <td bgcolor="red">
            <font color="white">
                Пушистым
            </font>
        </td>

    </tr>

</table>

</body>
</html>
